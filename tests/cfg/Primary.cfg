#!/usr/bin/env python3
from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, int_t, double_t, bool_t, str_t
gen = ParameterGenerator()
gen.add("alpha", int_t, 0, "Synthetic integer field", 128, -100000, 100000)
gen.add("beta", int_t, 0, "Synthetic second integer field", 64, -100000, 100000)
gen.add("scale", double_t, 0, "Synthetic double field", 1.0, -100000.0, 100000.0)
gen.add("enabled", bool_t, 0, "Synthetic boolean field", False)
gen.add("label", str_t, 0, "Synthetic string field", "cfg-default")
exit(gen.generate("ros_noetic_params_plugin", "ros_noetic_params_plugin", "Primary"))
